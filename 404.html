<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Maicon Moura</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .notfound-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }
    .notfound-card {
      background: rgba(15, 15, 15, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 48px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .notfound-card h1 {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
    }
    .notfound-card p {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 8px;
    }
    .notfound-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 10px;
      background: #ffffff;
      color: #1d1d1f;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .notfound-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="os-root">
    <div class="wallpaper-layer" aria-hidden="true">
      <img src="assets/images/wallpaper-studio.png" alt="" />
    </div>
    <header class="top-menubar">
      <a href="./">MAICON MOURA</a>
      <a href="./#portfolio">DESIGNER &amp; VISUAL STORYTELLER</a>
    </header>
    <div class="notfound-wrap">
      <div class="notfound-card">
        <h1>404</h1>
        <p>Esta página não foi encontrada.</p>
        <a class="notfound-btn" href="./">Voltar ao início</a>
      </div>
    </div>
  </div>
</body>
</html>
