<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste — efeito de tinta</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#111;font-family:"Inter",system-ui,sans-serif}
.hero{position:relative;height:100svh;overflow:hidden;background:#222;cursor:crosshair}
.hero img.bw,.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero img.bw{object-fit:cover;object-position:62% 30%;filter:grayscale(1) contrast(1.05) brightness(.92)}
.hero canvas{pointer-events:none}
.pill{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(15,15,15,.82);color:#fff;font-weight:600;font-size:12px;letter-spacing:.06em;padding:14px 22px;border-radius:10px;text-transform:uppercase}
.name{position:absolute;left:0;right:0;bottom:-.06em;z-index:2;text-align:center;font-weight:800;letter-spacing:-.05em;line-height:.8;font-size:clamp(60px,17vw,300px);color:#ff6a13;text-transform:uppercase;pointer-events:none;white-space:nowrap}
.tag{position:absolute;left:0;right:0;bottom:calc(clamp(60px,17vw,300px) * .86);z-index:2;text-align:center;color:#ff6a13;font-size:13px;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.tag span{display:block;color:#fff;opacity:.85;margin-top:6px}
</style>
</head>
<body>
<section class="hero" id="hero">
  <img class="bw" id="bw" src="../assets/images/wallpaper-maicon-studio.jpg" alt="Maicon Moura">
  <canvas id="ink"></canvas>
  <div class="pill">Maicon Moura</div>
  <div class="tag">Brand designer &amp; visual storyteller<span>Identidades visuais com história</span></div>
  <div class="name">Maicon Moura</div>
</section>
<script>
(() => {
  const hero = document.getElementById("hero"), cv = document.getElementById("ink"), ctx = cv.getContext("2d");
  const mask = document.createElement("canvas"), mx = mask.getContext("2d");
  const color = new Image(); color.src = "../assets/images/wallpaper-maicon-studio.jpg";
  const POS = { x: .62, y: .30 }; // mesmo object-position da imagem em P&B
  let W = 0, H = 0, dpr = 1, alive = 0, raf = 0, last = null, ready = false;
  function size(){
    const r = hero.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(r.width * dpr); H = Math.round(r.height * dpr);
    cv.width = mask.width = W; cv.height = mask.height = H;
  }
  function cover(c, im){
    const s = Math.max(W / im.naturalWidth, H / im.naturalHeight), w = im.naturalWidth * s, h = im.naturalHeight * s;
    c.drawImage(im, (W - w) * POS.x, (H - h) * POS.y, w, h);
  }
  function blob(x, y, r){
    const n = 11, pts = [], rot = Math.random() * 6.28;
    for(let i = 0; i < n; i++){ const a = rot + i / n * 6.28, k = .62 + Math.random() * .62; pts.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
    mx.beginPath();
    for(let i = 0; i < n; i++){
      const p = pts[i], q = pts[(i + 1) % n], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
      if(i === 0){ const pr = pts[n - 1]; mx.moveTo((pr[0] + p[0]) / 2, (pr[1] + p[1]) / 2); }
      mx.quadraticCurveTo(p[0], p[1], m[0], m[1]);
    }
    mx.closePath(); mx.fill();
  }
  function frame(){
    mx.globalCompositeOperation = "destination-out"; mx.fillStyle = "rgba(0,0,0,.028)"; mx.fillRect(0, 0, W, H);
    mx.globalCompositeOperation = "source-over";
    ctx.globalCompositeOperation = "source-over"; ctx.clearRect(0, 0, W, H);
    if(ready){ ctx.filter = "saturate(2.6) contrast(1.12) brightness(1.04) sepia(.25)"; cover(ctx, color); ctx.filter = "none"; }
    ctx.globalCompositeOperation = "destination-in"; ctx.drawImage(mask, 0, 0);
    alive--; raf = alive > 0 ? requestAnimationFrame(frame) : 0;
    if(!raf) ctx.clearRect(0, 0, W, H);
  }
  function drop(x, y, r){ mx.fillStyle = "#000"; blob(x * dpr, y * dpr, r * dpr); alive = 140; if(!raf) raf = requestAnimationFrame(frame); }
  hero.addEventListener("pointermove", (e) => {
    const b = hero.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    if(last){
      const d = Math.hypot(x - last.x, y - last.y);
      if(d < 26) return;
      const steps = Math.min(8, Math.floor(d / 26));
      for(let i = 1; i <= steps; i++) drop(last.x + (x - last.x) * i / steps, last.y + (y - last.y) * i / steps, 46 + Math.random() * 40 + Math.min(d, 90) * .2);
    } else drop(x, y, 60);
    last = { x, y };
  });
  hero.addEventListener("pointerleave", () => { last = null; });
  color.onload = () => { ready = true; };
  window.addEventListener("resize", size); size();
})();
</script>
</body>
</html>
